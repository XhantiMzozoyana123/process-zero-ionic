<ion-header>
  <ion-toolbar>
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="floating">New Password</ion-label>
    <ion-input type="password" [(ngModel)]="newPassword"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Confirm Password</ion-label>
    <ion-input type="password" [(ngModel)]="confirmPassword"></ion-input>
  </ion-item>

  <ion-button expand="full" (click)="resetPassword()" [disabled]="loading">
    {{ loading ? 'Resetting...' : 'Reset Password' }}
  </ion-button>

  <ion-button expand="full" fill="clear" routerLink="/login">
    Back to Login
  </ion-button>

</ion-content>
