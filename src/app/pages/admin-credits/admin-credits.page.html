<ion-header>
  <ion-toolbar>
    <ion-title>Admin Credits</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding admin-credits-page">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Create Package</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label position="floating">Name</ion-label>
        <ion-input [(ngModel)]="createPackageForm.name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Credits</ion-label>
        <ion-input type="number" [(ngModel)]="createPackageForm.creditAmount"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Price</ion-label>
        <ion-input type="number" [(ngModel)]="createPackageForm.price"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Description</ion-label>
        <ion-textarea [(ngModel)]="createPackageForm.description"></ion-textarea>
      </ion-item>
      <ion-button expand="block" (click)="create()">Create Package</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-list>
    <ion-list-header>Packages</ion-list-header>
    @for (pkg of packages$ | async; track pkg.id) {
      <ion-item>
        <ion-label>
          <h2>{{ pkg.name }}</h2>
          <p>{{ pkg.description }}</p>
          <p>{{ pkg.creditAmount }} credits - {{ pkg.currency === 'ZAR' ? 'R' : '$' }}{{ pkg.price | number:'1.2-2' }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>
</ion-content>
