<!-- RIGHT SIDEBAR (QUICK ACTIONS) -->
<ion-menu contentId="admin-content" side="end" type="overlay" menuId="admin-settings-menu">
  <ion-header>
    <ion-toolbar class="sidebar-toolbar-end">
      <ion-title>Quick Actions</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="sidebar-content">
    <ion-list class="sidebar-list" lines="none">
      <ion-item routerLink="/account/dashboard" routerDirection="forward" class="sidebar-item user-switch">
        <ion-icon name="swap-horizontal-outline" slot="start"></ion-icon>
        <ion-label>Switch to User View</ion-label>
      </ion-item>
      <ion-item button (click)="logout()" class="sidebar-item logout-item">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- MAIN ADMIN CONTENT -->
<div id="admin-content">
  <ion-header>

      <ion-buttons slot="start">

      </ion-buttons>
      <ion-title>
        <ion-icon name="pulse-outline" class="brand-icon"></ion-icon>
