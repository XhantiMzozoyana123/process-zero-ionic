<ion-content class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="brand"><ion-icon name="pulse-outline"></ion-icon> Process Zero</h1>
        <p class="subtitle">Reset your password</p>
      </div>

      <div class="auth-form">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="you@example.com"
                 [(ngModel)]="email" />
        </div>

        <button class="btn-primary" (click)="sendResetLink()" [disabled]="loading">
          <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
          {{ loading ? 'Sending...' : 'Send Reset Link' }}
        </button>

        <div class="auth-links">
          <a routerLink="/login" class="link-accent">Back to Sign In</a>
        </div>
      </div>
    </div>
  </div>
</ion-content>
