<!-- LEFT SIDEBAR -->
<ion-menu contentId="impersonation-content" side="start" type="overlay" menuId="impersonation-menu">
  <ion-header>
    <ion-toolbar class="sidebar-toolbar">
      <ion-title>
        <ion-icon name="pulse-outline"></ion-icon>
        <span class="impersonation-badge">Impersonating</span>
        Process Zero
      </ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="sidebar-content">
    <ion-list class="sidebar-list" lines="none">
      <ion-item routerLink="/impersonation/dashboard" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="home-outline" slot="start"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/leadlake" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="globe-outline" slot="start"></ion-icon>
        <ion-label>Lead Lake</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/contacts" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="call-outline" slot="start"></ion-icon>
        <ion-label>My Contacts</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/meetings" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="calendar-outline" slot="start"></ion-icon>
        <ion-label>Meetings</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/products" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="pricetag-outline" slot="start"></ion-icon>
        <ion-label>Products</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/videos" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="videocam-outline" slot="start"></ion-icon>
        <ion-label>Videos</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/kpi-policies" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
        <ion-label>KPI Policies</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/relay-user" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
        <ion-label>Relay AI</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/help" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="help-circle-outline" slot="start"></ion-icon>
        <ion-label>Help & Guide</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/settings" routerLinkActive="active-link" class="sidebar-item">
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Settings</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- RIGHT SIDEBAR (QUICK ACTIONS) -->
<ion-menu contentId="impersonation-content" side="end" type="overlay" menuId="impersonation-settings-menu">
  <ion-header>
    <ion-toolbar class="sidebar-toolbar-end">
      <ion-title>Quick Actions</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="sidebar-content">
    <ion-list class="sidebar-list" lines="none">
      <ion-item routerLink="/impersonation/bank-account" routerDirection="forward" class="sidebar-item">
        <ion-icon name="card-outline" slot="start"></ion-icon>
        <ion-label>Banking Details</ion-label>
      </ion-item>
      <ion-item routerLink="/impersonation/change-password" routerDirection="forward" class="sidebar-item">
        <ion-icon name="key-outline" slot="start"></ion-icon>
        <ion-label>Change Password</ion-label>
      </ion-item>
      <ion-item (click)="switchBackToAdmin()" class="sidebar-item admin-switch">
        <ion-icon name="swap-horizontal-outline" slot="start"></ion-icon>
        <ion-label>Switch Back to Admin</ion-label>
      </ion-item>
      <ion-item button (click)="logout()" class="sidebar-item">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- MAIN IMPERSONATION CONTENT -->
<div id="impersonation-content">
  <ion-header>
    <ion-toolbar class="main-toolbar">
      <ion-buttons slot="start">
        <ion-menu-button menu="impersonation-menu"></ion-menu-button>
      </ion-buttons>
      <ion-title>
        <ion-icon name="pulse-outline" class="brand-icon"></ion-icon>
        <span class="brand-title">Process Zero</span>
        <ion-badge color="warning" class="impersonation-badge-header">IMPERSONATING</ion-badge>
      </ion-title>
      <ion-buttons slot="end">
        <ion-menu-button menu="impersonation-settings-menu"></ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-router-outlet></ion-router-outlet>
  </ion-content>
</div>
