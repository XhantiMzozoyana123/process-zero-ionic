<ion-content class="password-page">
  <div class="center-wrap">
    <!-- Header -->
    <section class="page-header">
      <div class="header-row">
        <div>
          <h1>Change Password</h1>
          <p>Update your login credentials securely.</p>
        </div>
      </div>
    </section>

    <!-- Form card -->
    <section class="cards-section">
      <div class="form-card">
      <div class="card-icon-row">
        <div class="card-avatar">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <h3>Update Your Password</h3>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <ion-item>
          <ion-label position="stacked">Current Password</ion-label>
          <ion-input type="password" formControlName="currentPassword"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">New Password</ion-label>
          <ion-input type="password" formControlName="newPassword"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Confirm New Password</ion-label>
          <ion-input type="password" formControlName="confirmPassword"></ion-input>
        </ion-item>

        <ion-note color="danger" *ngIf="passwordsMismatch" class="field-error">
          New passwords do not match.
        </ion-note>

        <button type="submit" class="submit-btn" [disabled]="loading || form.invalid">
          {{ loading ? 'Saving...' : 'Change Password' }}
        </button>
      </form>
    </div>
  </section>
  </div>
