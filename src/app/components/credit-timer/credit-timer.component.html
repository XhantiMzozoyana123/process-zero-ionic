<div class="credit-timer-widget">
  <!-- Loading State -->
  <div class="timer-loading" *ngIf="isLoading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
  </div>

  <!-- Timer Display - Live countdown timer -->
  <div class="timer-display" *ngIf="!isLoading" [class.timer-expired]="isExpired" title="Remaining Active Usage Time">
    <div class="timer-icon">
      <ion-icon name="time-outline"></ion-icon>
    </div>
    <div class="timer-info">
      <div class="timer-label">
        Active Usage Time Remaining
        <span class="live-badge" *ngIf="!isExpired && !isBlocked">● LIVE</span>
        <span class="consuming-badge" *ngIf="isConsuming && !isExpired">⏳ CONSUMING</span>
        <span class="blocked-badge" *ngIf="isBlocked">⛔ BLOCKED</span>
      </div>
      <div class="timer-value">
        <span class="time-block hours">{{ displayHours }}</span>
        <span class="time-sep">:</span>
        <span class="time-block minutes">{{ displayMinutes }}</span>
        <span class="time-sep">:</span>
        <span class="time-block seconds">{{ displaySeconds }}</span>
      </div>
      <div class="timer-sub" *ngIf="!isExpired">
        Updated {{ lastUpdated }} (counts down live)
      </div>
      <div class="timer-sub expired-text" *ngIf="isExpired">No active credits remaining</div>
    </div>
    <div class="timer-actions" *ngIf="!isExpired">
      <ion-button fill="clear" size="small" class="timer-refresh-btn" (click)="refreshTimer()">
        <ion-icon slot="icon-only" name="refresh-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" size="small" class="timer-buy-btn" (click)="openTopUpPackages()">
        <ion-icon slot="icon-only" name="add-circle-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
