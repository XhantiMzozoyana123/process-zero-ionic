<!-- Floating Chat Button -->
<ion-fab *ngIf="!isOpen" vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="toggleChat()" class="chat-fab">
    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- Minimized Chat Button -->
<ion-fab *ngIf="isOpen && isMinimized" vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button (click)="maximizeChat()" class="chat-fab">
    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- Chat Widget -->
<ion-card *ngIf="isOpen && !isMinimized" [class]="'chatbot-widget' + (isMaximized ? ' maximized' : '')">
  <ion-card-header class="chatbot-header">
    <ion-card-title>
      <ion-icon name="pulse-outline" class="header-icon"></ion-icon>
      Process Zero Assistant
    </ion-card-title>
    <div class="header-actions">
      <ion-button *ngIf="!isMaximized" fill="clear" (click)="maximizeChat()" class="action-btn" title="Maximize">
        <ion-icon name="expand-outline"></ion-icon>
      </ion-button>
      <ion-button *ngIf="isMaximized" fill="clear" (click)="restoreChat()" class="action-btn" title="Restore">
        <ion-icon name="contract-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="minimizeChat()" class="action-btn" title="Minimize">
        <ion-icon name="remove-outline"></ion-icon>
      </ion-button>
      <ion-button fill="clear" (click)="closeChat()" class="close-btn" title="Close">
        <ion-icon name="close-circle-outline"></ion-icon>
      </ion-button>
    </div>
  </ion-card-header>

  <ion-card-content class="chatbot-content">
    <div class="messages-container">
      <div *ngFor="let msg of messages" [class]="'message ' + msg.sender">
        <div class="message-bubble">
          {{ msg.text }}
        </div>
      </div>
    </div>
  </ion-card-content>

  <div class="chatbot-input">
    <ion-item class="input-item" lines="none">
      <ion-textarea
        [(ngModel)]="userMessage"
        placeholder="Type your question..."
        rows="1"
        class="chat-textarea"
        (keydown.enter)="sendMessage()"
      ></ion-textarea>
      <ion-button (click)="sendMessage()" class="send-btn" [disabled]="userMessage.trim() === ''">
        <ion-icon name="send-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </div>
</ion-card>
